name = "birdquiz-bug-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

# Custom domain — created automatically on deploy (sethhopper.com is on Cloudflare).
routes = [
  { pattern = "birds-api.sethhopper.com", custom_domain = true },
]

[vars]
REPO = "hoppese/BirdQuiz"
BRANCH = "main"
ALLOWED_ORIGINS = "https://hoppese.github.io,http://localhost:8765"

# GITHUB_TOKEN is a secret, not a var:
#   npx wrangler secret put GITHUB_TOKEN
